[project]
name = "semv"
version = "0.1.0"
description = "Semantic File Organizer"
authors = [
    {name = "Odilon VIDAL"}
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "typer[all] (>=0.15.0)",
    "rich (>=13.7.0,<15.0.0)",
    "questionary (>=2.1.1,<3.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pymupdf (>=1.27.2.3,<2.0.0.0)",
    "langchain (>=1.3.18,<2.0.0)",
    "langchain-mistralai (>=1.1.6,<2.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "send2trash (>=2.1.0,<3.0.0)",
    "pillow (>=12.3.0,<13.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
semv = "semv.cli:app"