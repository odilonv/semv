[project]
name = "semv"
version = "0.1.0"
description = ""
authors = [
    {name = "Odilon VIDAL"}
]
requires-python = ">=3.13"
dependencies = [
    "typer[all] (>=0.26.7,<0.27.0)",
    "rich (>=13.7.0,<15.0.0)",
    "questionary (>=2.1.1,<3.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "instructor (>=1.15.1,<2.0.0)",
    "watchdog (>=6.0.0,<7.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "chromadb (>=1.5.9,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
semv = "semv.cli:app"